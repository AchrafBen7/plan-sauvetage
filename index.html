<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan sauvetage">
<meta name="theme-color" content="#0C1120" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F4FA" media="(prefers-color-scheme: light)">
<title>Plan sauvetage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232747D6'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root {
  /* Layout: one column on phones, a full-width dashboard on desktop. Two big countdowns (next deadline, next exam) open every view; below, the day's mission. Each course is a "line" with a solid transit-style badge colour, reused in countdowns, route, blok calendar and course cards. */
  --bg: #F2F4FA;
  --grid: rgba(39, 71, 214, .055);
  --card: #FFFFFF;
  --ink: #121A30;
  --ink-2: #4A546F;
  --ink-3: #727B95;
  --line: #E0E5EF;
  --soft: #EEF1F8;
  --pen: #2747D6;
  --pen-ink: #FFFFFF;
  --pen-soft: #E6EBFF;
  --mark: #FFE45C;
  --mark-ink: #2B2400;
  --ok: #1D7A4E;
  --ok-soft: #E1F3E9;
  --crit: #C0352C;
  --crit-soft: #FCEAE8;
  --badge-ink: #FFFFFF;
  --c-calc: #D2500F;
  --c-scp1: #6741D9;
  --c-ads1: #1A6DBF;
  --c-ads3: #0B7489;
  --c-log: #C02660;
  --c-dw: #4E7F0C;
  --c-admin: #66708A;
  --shadow: 0 1px 2px rgba(18, 26, 48, .05), 0 14px 34px -20px rgba(18, 26, 48, .3);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1120; --grid: rgba(143, 163, 255, .055); --card: #151C31;
    --ink: #EAEDF5; --ink-2: #B6BDD1; --ink-3: #8D96AE; --line: #263052; --soft: #1B2340;
    --pen: #8FA3FF; --pen-ink: #0C1120; --pen-soft: #1D2652; --mark: #FFE45C; --mark-ink: #1E1900;
    --ok: #55CB92; --ok-soft: #12321F; --crit: #FF7F75; --crit-soft: #3A1815; --badge-ink: #0C1120;
    --c-calc: #FF9457; --c-scp1: #AC96FF; --c-ads1: #68B2F8; --c-ads3: #45C8DA; --c-log: #F4729F; --c-dw: #9FD942; --c-admin: #A0A9C0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 34px -20px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1120; --grid: rgba(143, 163, 255, .055); --card: #151C31;
  --ink: #EAEDF5; --ink-2: #B6BDD1; --ink-3: #8D96AE; --line: #263052; --soft: #1B2340;
  --pen: #8FA3FF; --pen-ink: #0C1120; --pen-soft: #1D2652; --mark: #FFE45C; --mark-ink: #1E1900;
  --ok: #55CB92; --ok-soft: #12321F; --crit: #FF7F75; --crit-soft: #3A1815; --badge-ink: #0C1120;
  --c-calc: #FF9457; --c-scp1: #AC96FF; --c-ads1: #68B2F8; --c-ads3: #45C8DA; --c-log: #F4729F; --c-dw: #9FD942; --c-admin: #A0A9C0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 34px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--pen); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
p, h1, h2, h3, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }

.wrap { max-width: 1760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { padding-block: 22px 0; }
main.wrap { padding-block: 14px 150px; }

/* header */
.hdr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title streak" "count count"; gap: 16px 20px; align-items: end; }
.hdr-title { grid-area: title; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 7vw, 2.7rem); line-height: .95; letter-spacing: -.025em; }
.hdr-date { margin-top: 8px; color: var(--ink-2); }
.streak { grid-area: streak; display: grid; justify-items: end; gap: 6px; }
.st-num { display: flex; align-items: baseline; gap: 6px; }
.st-num b { font-family: var(--f-mono); font-size: 1.6rem; line-height: 1; color: var(--ink); }
.st-num span { font-size: .8125rem; color: var(--ink-2); }
.dots { display: flex; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--pen); }
.dots i.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--mark); }
@media (max-width: 559px) { .hdr { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "streak" "count"; } .streak { justify-items: start; } }

/* the two countdowns */
.count2 { grid-area: count; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; min-width: 0; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 13px; box-shadow: var(--shadow); min-width: 0; }
.cd-k { font-family: var(--f-mono); font-size: .625rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.cd-n { margin-top: 6px; font-family: var(--f-mono); font-weight: 700; font-size: clamp(2.1rem, 10vw, 2.9rem); line-height: .9; letter-spacing: -.045em; color: var(--cc, var(--pen)); font-variant-numeric: tabular-nums; }
.cd-t { display: flex; align-items: flex-start; gap: 6px; margin-top: 10px; font-weight: 700; font-size: .875rem; line-height: 1.25; min-width: 0; }
.cd-t span:last-child { min-width: 0; overflow-wrap: anywhere; }
.cd-w { margin-top: 3px; font-size: .75rem; color: var(--ink-2); }
.cd.hot { background: var(--mark); border-color: var(--mark); }
.cd.hot .cd-k, .cd.hot .cd-n, .cd.hot .cd-t, .cd.hot .cd-w { color: var(--mark-ink); }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); margin-top: 14px; border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tabs a { flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: .875rem; }
.tabs a:hover { background: var(--soft); color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }

.view { display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.375rem; letter-spacing: -.015em; line-height: 1.1; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.0625rem; line-height: 1.2; text-wrap: balance; }
.kicker { font-family: var(--f-mono); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-s { font-family: var(--f-mono); font-size: .75rem; color: var(--ink-3); }
.muted { color: var(--ink-2); }

/* badges: one solid colour per course */
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 21px; padding: 0 6px; border-radius: 6px; background: var(--cc, var(--c-admin)); color: var(--badge-ink); font-family: var(--f-mono); font-size: .6875rem; font-weight: 700; letter-spacing: .03em; flex: 0 0 auto; }
.c-calc { --cc: var(--c-calc); } .c-scp1 { --cc: var(--c-scp1); } .c-ads1 { --cc: var(--c-ads1); } .c-ads3 { --cc: var(--c-ads3); } .c-log { --cc: var(--c-log); } .c-dw { --cc: var(--c-dw); } .c-admin { --cc: var(--c-admin); }

/* route line */
.stops { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 60px; padding-bottom: 8px; overflow-x: auto; scrollbar-width: thin; }
.stops::before { content: ""; position: absolute; left: 30px; top: 9px; height: 3px; width: calc(60px * (var(--n) - 1)); background: var(--line); border-radius: 2px; }
.stop { position: relative; display: grid; justify-items: center; gap: 1px; text-align: center; }
.stop .dot { width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; background: var(--card); border: 3px solid var(--cc, var(--ink-3)); position: relative; z-index: 1; }
.stop.ex .dot { width: 20px; height: 20px; margin-top: 0; border-radius: 6px; background: var(--cc); border-color: var(--cc); }
.stop.now .dot { background: var(--pen); border-color: var(--pen); }
.stop b { margin-top: 5px; font-family: var(--f-mono); font-size: .6875rem; font-weight: 700; }
.stop.ex b { color: var(--cc); }
.stop small { font-family: var(--f-mono); font-size: .625rem; color: var(--ink-3); }
.stop em { font-style: normal; font-family: var(--f-mono); font-size: .625rem; color: var(--ink-2); }
.stop.soon em { color: var(--mark-ink); background: var(--mark); border-radius: 3px; padding: 0 3px; }

/* mission */
.m-top { display: flex; align-items: center; gap: 14px; }
.ring-wrap { position: relative; width: 70px; height: 70px; flex: 0 0 auto; }
.ring { width: 70px; height: 70px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 7; }
.ring-fg { fill: none; stroke: var(--cc, var(--ok)); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring-num { position: absolute; inset: 0; display: grid; place-content: center; font-family: var(--f-mono); font-weight: 700; font-size: 1rem; }
.m-sub { margin-top: 4px; font-size: .875rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.good { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: .875rem; background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.cta { margin-top: 14px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 0; border-radius: 12px; background: var(--pen); color: var(--pen-ink); font-weight: 700; font-size: 1rem; cursor: pointer; text-align: left; }
.cta svg { width: 16px; height: 16px; fill: currentColor; flex: 0 0 auto; }
.cta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cta:hover { filter: brightness(1.06); }
.m-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip-btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .8125rem; font-weight: 700; color: var(--ink-2); cursor: pointer; text-decoration: none; display: inline-block; }
.chip-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.chip-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* tasks */
.tasks { margin-top: 10px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.tasks > .task:first-child { border-top: 0; }
.cb { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--ink-3); border-radius: 8px; display: grid; place-content: center; cursor: pointer; background: var(--card); }
.cb::after { content: ""; width: 12px; height: 6px; border: 2.5px solid var(--card); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); opacity: 0; }
.cb:checked { background: var(--ok); border-color: var(--ok); }
.cb:checked::after { opacity: 1; }
.cb:disabled { opacity: .45; cursor: not-allowed; }
.t-main { display: flex; align-items: center; gap: 8px; min-width: 0; border: 0; background: none; padding: 4px 0; cursor: pointer; text-align: left; }
.t-title { flex: 1 1 auto; min-width: 0; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.t-min { flex: 0 0 auto; font-family: var(--f-mono); font-size: .75rem; color: var(--ink-3); }
.task.is-done .t-title { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--ink-3); }
.task.is-done .badge { opacity: .45; }
.task.is-missed .t-title { color: var(--ink-3); }
.play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); display: grid; place-content: center; cursor: pointer; color: var(--pen); }
.play svg { width: 12px; height: 12px; fill: currentColor; margin-left: 2px; }
.play:hover { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.play-ph { width: 34px; }
.t-more { grid-column: 2 / -1; padding: 0 0 4px; font-size: .875rem; color: var(--ink-2); }
.t-tools { display: flex; gap: 14px; margin-top: 6px; }
.link { border: 0; background: none; padding: 0; color: var(--pen); font-size: .8125rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.due { flex: 0 0 auto; font-family: var(--f-mono); font-size: .6875rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; color: var(--ink-2); background: var(--soft); white-space: nowrap; }
.due.hot { background: var(--mark); color: var(--mark-ink); }
.due.warm { background: var(--crit-soft); color: var(--crit); }
.late { flex: 0 0 auto; font-family: var(--f-mono); font-size: .6875rem; color: var(--crit); white-space: nowrap; }

/* folds */
details.fold > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
.fold-t { font-family: var(--f-display); font-weight: 600; font-size: 1.0625rem; }
.fold-n { font-family: var(--f-mono); font-size: .75rem; color: var(--ink-3); margin-left: auto; }
details.fold > summary::after { content: "+"; font-family: var(--f-mono); color: var(--ink-3); font-size: 1.1rem; line-height: 1; }
details.fold[open] > summary::after { content: "−"; }
details.fold[open] > summary { margin-bottom: 6px; }

/* add form */
.add { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: end; }
.add .field:first-child, .add .field:nth-child(4), .add .btn { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .75rem; font-weight: 700; color: var(--ink-2); }
.input { height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%; min-width: 0; }
.input:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft); }
.btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--pen); color: var(--pen-ink); font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* weeks */
.rule1 { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .9375rem; }
.rule1 b { font-family: var(--f-mono); font-size: .6875rem; letter-spacing: .06em; text-transform: uppercase; background: var(--mark); color: var(--mark-ink); padding: 2px 6px; border-radius: 4px; flex: 0 0 auto; }
details.week { border-top: 1px solid var(--line); }
details.week:first-of-type { border-top: 0; }
details.week > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 46px minmax(0, 1fr) 84px; gap: 10px; align-items: center; padding: 10px 0; }
details.week > summary::-webkit-details-marker { display: none; }
.wk-n { font-family: var(--f-mono); font-weight: 700; font-size: .8125rem; height: 30px; border-radius: 8px; background: var(--soft); display: grid; place-content: center; }
details.week.now .wk-n { background: var(--mark); color: var(--mark-ink); }
.wk-t { font-weight: 700; min-width: 0; }
.wk-d { display: block; font-family: var(--f-mono); font-size: .6875rem; color: var(--ink-3); font-weight: 500; }
.wk-p { display: grid; gap: 4px; justify-items: end; font-family: var(--f-mono); font-size: .75rem; color: var(--ink-2); }
.bar { width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.wk-note { font-size: .8125rem; color: var(--ink-2); padding-left: 56px; }
.wk-body { padding-bottom: 8px; }
.wk-body .tasks { margin-top: 2px; }

/* blok calendar */
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-head { margin-bottom: 4px; }
.cal-head span { text-align: center; font-family: var(--f-mono); font-size: .6875rem; color: var(--ink-3); }
.tile { aspect-ratio: 1 / 1; max-width: 100%; min-width: 0; border-radius: 9px; border: 1px solid var(--line); background: var(--card); padding: 4px 5px; display: grid; grid-template-rows: auto 1fr; text-align: left; cursor: pointer; color: var(--ink); }
.tile-n { font-family: var(--f-mono); font-size: .6875rem; font-weight: 700; line-height: 1; }
.tile-x { align-self: end; font-family: var(--f-mono); font-size: .5625rem; font-weight: 700; line-height: 1; overflow: hidden; }
.tile .bars { align-self: end; display: grid; gap: 2px; }
.tile .bars i { display: block; height: 4px; border-radius: 2px; background: var(--cc); }
.tile.exam { background: var(--cc); border-color: var(--cc); color: var(--badge-ink); }
.tile.final { background: color-mix(in srgb, var(--cc) 20%, var(--card)); border-color: color-mix(in srgb, var(--cc) 55%, var(--card)); }
.tile.off { background: repeating-linear-gradient(135deg, var(--soft) 0 4px, transparent 4px 8px); color: var(--ink-3); }
.tile.empty { opacity: .3; border-style: dashed; cursor: default; }
.tile.today { box-shadow: 0 0 0 2px var(--mark); }
.tile.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 10px; font-size: .75rem; color: var(--ink-3); }
.cal-day { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.exam-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: .9375rem; }

/* exams */
.exams li { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.exams li:first-child { border-top: 0; }
.exams li.past { opacity: .45; }
.ex-date { height: 58px; border-radius: 12px; background: var(--cc); color: var(--badge-ink); display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ex-date b { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; }
.ex-date small { font-family: var(--f-mono); font-size: .625rem; text-transform: uppercase; letter-spacing: .05em; }
.ex-name { font-weight: 700; display: block; }
.ex-parts { display: block; font-size: .8125rem; color: var(--ink-2); margin-top: 2px; }

/* ---------- focus timer ---------- */
var tickH = null, wake = null, audioCtx = null;
function ensureAudio() { try { if (!audioCtx) { var A = window.AudioContext || window.webkitAudioContext; if (A) audioCtx = new A(); } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { audioCtx = null; } }
function chime() {
  try {
    if (!audioCtx) return;
    [0, 0.22, 0.44].forEach(function (t, i) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [660, 880, 1046][i];
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.35);
      o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.4);
    });
  } catch (e) { /* no audio */ }
}
function requestWake() { try { if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {}); } catch (e) { /* unsupported */ } }
function releaseWake() { try { if (wake) wake.release(); } catch (e) { /* ignore */ } wake = null; }
function startFocus(task) {

  prefs.timer = { taskId: task ? task.id : '', c: task ? task.c : 'admin', t: task ? task.t : 'Focus libre', dur: 25, endAt: Date.now() + 25 * 60000, paused: false, left: 0 };
  savePrefs(); runTimer(); requestWake();
}
function timeLeft(tm) { return tm.paused ? tm.left : Math.max(0, tm.endAt - Date.now()); }
function runTimer() {
  var tm = prefs.timer, bar = $('#focusbar');
  if (!tm) { bar.hidden = true; clearInterval(tickH); return; }
  bar.hidden = false;
  var b = $('#fb-badge'), k = COURSES[tm.c] ? tm.c : 'admin'; b.className = 'badge c-' + k; b.textContent = COURSES[k].code;
  $('#fb-title').textContent = tm.t;

}
function updateTimer() {

function finishFocus(natural) {

  else toast(elapsed >= 5 ? 'Séance enregistrée : ' + elapsed + ' min.' : 'Séance trop courte, non comptée.');
}

  initStore();
})();
})();
</script>
